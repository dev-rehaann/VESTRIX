name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint-test:
    name: Python lint + test (pipeline, ml, forensics, collector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.21 pytest==9.1.1
          pip install -r collector/requirements.txt
          pip install -r forensics/requirements.txt
          pip install -e ./forensics
          pip install -e ./collector
          pip install -e ./soc-integration

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest -q

  wazuh-rule-validation:
    name: Validate Wazuh rules/decoders syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check XML well-formedness
        run: |
          shopt -s globstar nullglob
          for f in soc-integration/wazuh/**/*.xml; do
            echo "Checking $f"
            python3 -c "import xml.etree.ElementTree as ET; ET.parse('$f')"
          done

  verifier-cli-build:
    name: Build + test verifier CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            verifier-cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('verifier-cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust tests
        working-directory: verifier-cli
        run: cargo test --all-targets --all-features

      - name: Run Clippy
        working-directory: verifier-cli
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Verify Python/Rust float canonicalization parity
        run: python3 forensics/check_float_canonicalization.py
